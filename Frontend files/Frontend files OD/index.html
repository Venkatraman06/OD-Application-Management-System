<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OD Application - On Duty Management System for students and faculty">
    <title>OD Application | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="floating-shape shape-4"></div>
        <div class="floating-shape shape-5"></div>
    </div>

    <div class="login-container">
        <div class="branding-panel">
            <div class="brand-content">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="8" y="8" width="48" height="48" rx="12" stroke="white" stroke-width="3"/>
                            <path d="M20 32L28 40L44 24" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="32" cy="16" r="4" fill="white" opacity="0.6"/>
                            <circle cx="32" cy="48" r="4" fill="white" opacity="0.6"/>
                        </svg>
                    </div>
                </div>
                <h1 class="brand-title">OD Application</h1>
                <p class="brand-subtitle">On Duty Management System</p>
                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 12l2 2 4-4"/>
                                <circle cx="12" cy="12" r="10"/>
                            </svg>
                        </div>
                        <span>Apply OD Requests Easily</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                            </svg>
                        </div>
                        <span>Track OD Status & History</span>
                    </div>
                </div>
            </div>
            <div class="brand-footer">
                <p>&copy; 2026 OD Application. All rights reserved.</p>
            </div>
        </div>

        <div class="form-panel">
            <div class="form-wrapper">
                <div class="mobile-logo">
                    <div class="logo-icon small">
                        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="8" y="8" width="48" height="48" rx="12" stroke="url(#grad1)" stroke-width="3"/>
                            <path d="M20 32L28 40L44 24" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <defs>
                                <linearGradient id="grad1" x1="0" y1="0" x2="64" y2="64">
                                    <stop offset="0%" style="stop-color:#6366f1"/>
                                    <stop offset="100%" style="stop-color:#8b5cf6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <h2 class="mobile-title">OD Application</h2>
                </div>

                <div class="form-header">
                    <h2 id="login-heading">Welcome Back</h2>
                    <p>Sign in to your account to continue</p>
                </div>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="input-group" id="rollno-group">
                        <label for="rollNumber">Roll Number </label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <input type="text" id="rollNumber" name="rollNumber" placeholder="Enter your roll number" autocomplete="username" required>
                            <div class="input-focus-line"></div>
                        </div>
                        <span class="error-message" id="rollno-error"></span>
                    </div>

                    <div class="input-group" id="password-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <div class="input-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </div>
                            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                            <div class="input-focus-line"></div>
                        </div>
                        <span class="error-message" id="password-error"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper" for="rememberMe">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span class="custom-checkbox">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                    <polyline points="20 6 9 17 4 12"/>
                                </svg>
                            </span>
                            <span class="checkbox-label">Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" id="forgotPassword">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="loginButton">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" style="display:none">
                            <span class="spinner"></span>
                        </span>
                    </button>

                    <div class="divider"><span>or</span></div>

                    <div class="signup-link">
                        <p>Don't have an account? <a href="#" id="signupLink">Contact Admin</a></p>
                        <p style="margin-top:6px"><a href="admin.html" style="font-size:0.78rem;opacity:0.6">Admin Panel</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <!-- Contact Admin Modal -->
    <div class="modal-overlay" id="contactAdminOverlay" style="display:none">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Contact Admin</h3>
                <button type="button" class="modal-close" id="contactAdminClose" aria-label="Close">&times;</button>
            </div>
            <form id="contactAdminForm" class="modal-body" novalidate>
                <div class="input-group">
                    <label for="contactRegNo">Register / Staff Number</label>
                    <input type="text" id="contactRegNo" name="contactRegNo" placeholder="Enter your register/staff number" required>
                </div>

                <div class="input-group">
                    <label for="contactDob">Date of Birth</label>
                    <input type="date" id="contactDob" name="contactDob" required>
                </div>

                <div class="input-group">
                    <label for="contactPassword">Password</label>
                    <input type="password" id="contactPassword" name="contactPassword" placeholder="Enter your password" required>
                </div>

                <div class="input-group">
                    <label for="contactRole">You are a</label>
                    <select id="contactRole" name="contactRole" required>
                        <option value="Student">Student</option>
                        <option value="Staff">Staff</option>
                        <option value="HOD">HOD</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="contactReport">Report / Issue</label>
                    <textarea id="contactReport" name="contactReport" rows="4" placeholder="Describe your issue (e.g. no account, forgot password, login problem)" required></textarea>
                </div>

                <button type="submit" class="login-btn" id="contactAdminSubmit">
                    <span class="btn-text">Send to Admin</span>
                    <span class="btn-loader" style="display:none"><span class="spinner"></span></span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js?v=20260821"></script>
</body>
</html>
